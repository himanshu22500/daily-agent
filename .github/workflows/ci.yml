name: CI

# The objective gate before a human reviews a PR. Runs the OFFLINE test suite
# only — every test mocks GitHub/Telegram/the LLM, so no secrets are needed and
# none are exposed to CI. Live verification (real GitHub Projects/Telegram/data) happens on
# the maintainer's machine before merge.

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: CI only reads the code (the repo is public; PRs from forks
# run here too). Actions are pinned to commit SHAs so a moved tag can't change
# what runs.
permissions:
  contents: read

# The commit on main that both jobs pass is what deploy-on-merge ships
# (issue #128): each machine polls GitHub for these two check results.

# One run per branch/PR; cancel superseded runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"

      - name: Run ruff lint
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

      - name: Run offline test suite
        run: uv run pytest -q

  postgres:
    # The same offline suite against Postgres (issue #111): the shared database
    # the Mac and the feed server both use. Every SQLite path a test opens is
    # mapped to its own schema (tests/conftest.py). "C" collation matches
    # SQLite's byte-order string comparisons.
    name: tests (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: daily_agent
          POSTGRES_PASSWORD: daily_agent
          POSTGRES_DB: daily_agent_test
          POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U daily_agent -d daily_agent_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DAILY_AGENT_TEST_DATABASE_URL: postgresql://daily_agent:daily_agent@localhost:5432/daily_agent_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"

      - name: Run offline test suite on Postgres
        run: uv run pytest -q
