{# A card just rated 👎: it folds into this note (issue #126). #}
<div class="story hidden-note" data-card data-swap>
  <span>Removed from your feed.</span>
  <form method="post" action="/items/{{ quote(entry.key) }}/unrate?as=card&next={{ quote(next_url) }}" data-action>
    <button type="submit" class="act">Undo</button>
  </form>
</div>
