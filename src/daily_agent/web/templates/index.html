<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Insights">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
  <title>{% if unseen %}({{ unseen }}) {% endif %}Insights</title>
</head>
<body>
  <header class="top">
    <div class="bar">
      <a class="brand" href="/">Insights</a>
      {% if unseen %}<span class="unseen">{{ unseen }} unseen</span>{% endif %}
    </div>
    <form class="search" action="/" method="get" role="search">
      <input type="hidden" name="view" value="latest">
      <input type="search" name="q" value="{{ filters.q }}" placeholder="Search insights" aria-label="Search insights">
    </form>
  </header>
  <nav class="sticky" aria-label="Feed">
    <div class="tabs">
      <a class="tab{% if filters.view == 'for-you' %} on{% endif %}" href="{{ feed_url() }}">For you</a>
      <a class="tab{% if filters.view == 'latest' %} on{% endif %}" href="{{ feed_url(view='latest') }}">Latest</a>
      <a class="tab{% if filters.view == 'saved' %} on{% endif %}" href="{{ feed_url(view='saved') }}">Saved</a>
      <a class="tab{% if filters.view == 'hidden' %} on{% endif %}" href="{{ feed_url(view='hidden') }}">Hidden</a>
    </div>
    {% if filters.view in ("for-you", "latest") %}
    <div class="chips">
      <a class="chip{% if not filters.type %} on{% endif %}" href="{{ feed_url(view=filters.view, q=filters.q) }}">All types</a>
      {% for type, count in types %}
      <a class="chip t-{{ type|type_class }}{% if filters.type == type %} on{% endif %}" href="{{ feed_url(view=filters.view, type=type, q=filters.q) }}">{{ type|label }} <span class="n">{{ count }}</span></a>
      {% endfor %}
    </div>
    {% endif %}
  </nav>
  <a class="fresh" id="fresh" href="{{ next_url }}" hidden></a>
  <main class="feed" id="feed" data-session="{{ session_id }}" data-opened="{{ opened_at }}">
    {% include "_cards.html" %}
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
