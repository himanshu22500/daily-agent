{# Generated cover: the "photo" slot of a Discover card. Expects `entry`. #}
<div class="cover t-{{ entry.type|type_class }}" style="{{ cover_style(entry.key, entry.type) }}" aria-hidden="true">
  <span class="cover-kind">{{ entry.type|label }}</span>
  {% if entry.source %}<span class="cover-badge">⌂ {{ entry.source }}</span>{% endif %}
  <span class="cover-topic">{{ "#" ~ entry.tags[0] if entry.tags else entry.type|label }}</span>
</div>
